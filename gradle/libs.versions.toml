[versions]
agp = "9.3.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"
ksp = "2.3.10"
koin = "4.2.2"
room = "2.8.4"
navigationCompose = "2.9.8"
serializationJson = "1.11.0"
mapsCompose = "8.4.0"
places = "5.3.0"
playServicesLocation = "21.3.0"
datastore = "1.1.7"
retrofit = "3.0.0"
okhttp = "5.4.0"
retrofitSerialization = "1.0.0"
coil = "3.5.0"
media3 = "1.10.1"
